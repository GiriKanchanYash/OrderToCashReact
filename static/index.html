    <script>
      // Data-source selection (Snowflake | Fabric). The o2c_data_source cookie is sent
      // with every /api request and read by server.py to route it to the chosen source.
      (function () {
        var KEY = "o2c_data_source", ok = { snowflake: 1, fabric: 1 };
        var m = document.cookie.match(/(?:^|;\s*)o2c_data_source=([^;]+)/);
        var v = m ? decodeURIComponent(m[1]) : null;
        if (!ok[v]) { try { v = localStorage.getItem(KEY); } catch (e) { v = null; } }
        window.__O2C_SET_DS__ = function (s) {
          if (!ok[s]) return;
          document.cookie = KEY + "=" + s + "; path=/; max-age=31536000; SameSite=Lax";
          try { localStorage.setItem(KEY, s); } catch (e) {}
          window.__O2C_DS__ = s;
        };
        if (ok[v]) window.__O2C_SET_DS__(v); else window.__O2C_DS__ = null;
      })();
    </script>

      .datasource-picker-select:hover{border-color:var(--brand)}
      .datasource-picker-select:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px #0d7d7226}
      @media (max-width:720px){.datasource-picker-label{display:none}.datasource-picker-select{font-size:12px;padding:5px 24px 5px 8px}}
    </style>
